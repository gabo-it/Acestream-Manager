<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="430" fill="#0f172a" rx="12" />

  <!-- Client group -->
  <rect x="30" y="150" width="150" height="120" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="105" y="140" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">YOUR DEVICE</text>
  <text x="105" y="200" text-anchor="middle" font-size="24">📱</text>
  <text x="105" y="228" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Browser</text>
  <text x="105" y="245" text-anchor="middle" fill="#64748b" font-size="10">(web player)</text>
  <text x="105" y="262" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">VLC</text>

  <!-- Server group -->
  <rect x="260" y="90" width="500" height="280" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="740" y="75" text-anchor="end" fill="#94a3b8" font-size="13" font-weight="600">🖥️ YOUR SERVER</text>

  <!-- acexy (moved right, gives the webui connector room to breathe) -->
  <rect x="505" y="100" width="150" height="100" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="580" y="128" text-anchor="middle" font-size="20">🔀</text>
  <text x="580" y="150" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">acexy</text>
  <text x="580" y="165" text-anchor="middle" fill="#94a3b8" font-size="11">:8080</text>
  <text x="580" y="182" text-anchor="middle" fill="#64748b" font-size="10">multiplexing</text>
  <text x="580" y="193" text-anchor="middle" fill="#64748b" font-size="10">proxy</text>

  <!-- webui (third line notes its direct engine calls, replacing the floating label) -->
  <rect x="290" y="130" width="150" height="120" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="365" y="156" text-anchor="middle" font-size="20">🌐</text>
  <text x="365" y="179" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">webui</text>
  <text x="365" y="194" text-anchor="middle" fill="#94a3b8" font-size="11">:4000</text>
  <text x="365" y="212" text-anchor="middle" fill="#64748b" font-size="10">channels · EPG</text>
  <text x="365" y="224" text-anchor="middle" fill="#64748b" font-size="10">search · football</text>
  <text x="365" y="240" text-anchor="middle" fill="#64748b" font-size="9">↔ engine: search/stats</text>

  <!-- engine -->
  <rect x="382" y="270" width="150" height="90" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="457" y="300" text-anchor="middle" font-size="22">⚙️</text>
  <text x="457" y="325" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">acestream-engine</text>
  <text x="457" y="343" text-anchor="middle" fill="#64748b" font-size="10">HTTP + P2P</text>

  <!-- Peers -->
  <circle cx="830" cy="315" r="55" fill="#0f172a" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" />
  <text x="830" y="307" text-anchor="middle" font-size="22">🌍</text>
  <text x="830" y="331" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">P2P peers</text>

  <!-- Arrows -->

  <!-- Path 1: web player, video proxied through webui -->
  <line x1="180" y1="200" x2="285" y2="175" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="200" y="155" fill="#94a3b8" font-size="11">web player</text>

  <!-- webui -> acexy: more horizontal room now that acexy moved right -->
  <line x1="440" y1="175" x2="500" y2="155" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="446" y="150" fill="#94a3b8" font-size="10">getstream</text>

  <!-- Path 2: VLC / M3U streams straight from acexy -->
  <path d="M 150 150 C 220 10, 500 10, 578 98" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)" />
  <text x="360" y="18" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">VLC / M3U — direct stream</text>

  <!-- acexy -> engine -->
  <line x1="558" y1="200" x2="475" y2="270" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="565" y="238" fill="#94a3b8" font-size="10">HTTP</text>

  <!-- webui <-> engine (search/stats), label now lives inside the webui box above -->
  <line x1="380" y1="250" x2="415" y2="270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)" />

  <line x1="532" y1="315" x2="772" y2="315" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="620" y="332" text-anchor="middle" fill="#94a3b8" font-size="10">P2P</text>

</svg>
