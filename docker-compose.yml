services:
  acestream:
    # image: for `up -d`; build: for `up -d --build` (builds from ./engine)
    image: ghcr.io/${GITHUB_OWNER:-gabo-it}/acestream-engine:latest
    build: ./engine
    container_name: acestream-engine
    restart: unless-stopped
    # Any official engine flag can go in ENGINE_FLAGS — see:
    # https://docs.acestream.net/developers/engine-command-line-options/
    environment:
      HTTP_PORT: "${HTTP_PORT:-6677}"
      PORT: "${P2P_PORT:-44556}"
      ACCESS_TOKEN: "${ACCESS_TOKEN:-}"
      ENGINE_FLAGS: "${ENGINE_FLAGS:---client-console --bind-all --live-cache-type memory}"
      TZ: "${TZ:-UTC}"
    # HTTP port published for the HLS playlist's native /ace/manifest.m3u8.
    # Set ACCESS_TOKEN above if this host is reachable beyond your LAN.
    expose:
      - "${HTTP_PORT:-6677}"
    ports:
      - "${HTTP_PORT:-6677}:${HTTP_PORT:-6677}"
      - "${P2P_PORT:-44556}:${P2P_PORT:-44556}/tcp"
      - "${P2P_PORT:-44556}:${P2P_PORT:-44556}/udp"
    networks:
      - acestream-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -t1 -O- http://127.0.0.1:$${HTTP_PORT}/webui/api/service?method=get_version | grep -q '\"error\": null'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # RAM-backed cache instead of the container's disk layer — resets on
    # restart, which is fine (P2P session state, not configuration).
    tmpfs:
      - /srv/ace/.ACEStream:size=512m,mode=1777

  acexy:
    # Pinned deliberately. Bump after checking: https://github.com/Javinator9889/acexy/releases
    image: ghcr.io/javinator9889/acexy:${ACEXY_VERSION:-0.2.2}
    container_name: acexy
    restart: unless-stopped
    depends_on:
      acestream:
        condition: service_healthy
    environment:
      ACEXY_HOST: acestream
      ACEXY_PORT: "${HTTP_PORT:-6677}"
      ACEXY_LISTEN_ADDR: ":8080"
      TZ: "${TZ:-UTC}"
      # Raised from acexy's 1s default — the engine often needs longer to
      # find first peers, causing spurious timeout failures otherwise.
      ACEXY_NO_RESPONSE_TIMEOUT: "${ACEXY_NO_RESPONSE_TIMEOUT:-30s}"
      # Raise if playback is choppy vs. hitting the engine directly.
      ACEXY_BUFFER_SIZE: "${ACEXY_BUFFER_SIZE:-4.2MiB}"
      # Raise if brief player hiccups cause stutter.
      ACEXY_CLIENT_EVICTION_TIMEOUT: "${ACEXY_CLIENT_EVICTION_TIMEOUT:-10s}"
    ports:
      - "${ACEXY_PORT_EXPOSED:-8080}:8080"
    networks:
      - acestream-net

  webui:
    image: ghcr.io/${GITHUB_OWNER:-gabo-it}/acestream-webui:latest
    build: ./webui
    container_name: acestream-webui
    restart: unless-stopped
    depends_on:
      - acexy
    environment:
      PORT: "4000"
      DB_PATH: /data/acestream.db
      ENV_FILE_PATH: /config/.env
      ACESTREAM_HTTP_PORT: "${HTTP_PORT:-6677}"
      # Containers default to UTC — the web UI itself always displays
      # times in your browser's own timezone regardless of this (fixed
      # separately), but this affects the container's own clock/logs and
      # a couple of server-generated status strings (e.g. "Last EPG
      # update"). Set to your IANA timezone, e.g. Europe/Rome.
      TZ: "${TZ:-UTC}"
    volumes:
      - webui-data:/data
      - ./.env:/config/.env
    ports:
      - "${WEBUI_PORT_EXPOSED:-4000}:4000"
    networks:
      - acestream-net

  # Optional: self-hosted EPG translation / cross-alphabet matching.
  # Disabled by default: docker compose --profile translate up -d
  # Then in the web UI, Playlist → LibreTranslate URL → http://libretranslate:5000
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    profiles: ["translate"]
    environment:
      # ~200MB RAM per language loaded — adjust to your actual EPG languages.
      LT_LOAD_ONLY: "${LIBRETRANSLATE_LANGUAGES:-en,it,ru}"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    networks:
      - acestream-net
    # Edit directly to match your hardware — no .env needed.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Optional: Cloudflare WARP for the webui's own outbound requests only —
  # not connected to AceStream/acexy traffic, nothing routed through it yet.
  # ⚠️ Requires NET_ADMIN — a much broader permission than anything else in
  # this stack. Disabled by default: docker compose --profile warp up -d
  warp:
    image: caomingjun/warp
    container_name: warp
    restart: unless-stopped
    profiles: ["warp"]
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY=  # optional: WARP+ or WARP Team license
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      - acestream-net

networks:
  acestream-net:
    driver: bridge

volumes:
  webui-data:
  libretranslate-models:
  warp-data:
