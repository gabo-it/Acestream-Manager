services:
  acestream:
    # Both image: and build: are set — "docker compose up -d" uses the
    # published image as-is; "docker compose up -d --build" builds from
    # ./engine instead (tags the result with the same name as image:, so
    # it's used going forward without needing --build again).
    image: ghcr.io/${GITHUB_OWNER:-gabo-it}/acestream-engine:latest
    build: ./engine
    container_name: acestream-engine
    restart: unless-stopped
    # All engine parameters below are customizable via environment
    # variables (defaults shown). Set them in Portainer's stack env vars,
    # or in a .env file next to this compose file. Any official engine flag
    # (https://docs.acestream.net/developers/engine-command-line-options/)
    # not covered by a dedicated variable can be added directly to
    # ENGINE_FLAGS — no need to add a new variable per flag.
    environment:
      HTTP_PORT: "${HTTP_PORT:-6677}"
      PORT: "${P2P_PORT:-44556}"
      ACCESS_TOKEN: "${ACCESS_TOKEN:-}"
      ENGINE_FLAGS: "${ENGINE_FLAGS:---client-console --bind-all --live-cache-type memory}"
    # HTTP port is published (needed for the HLS playlist's native
    # /ace/manifest.m3u8 endpoint). Set ACCESS_TOKEN above if this host is
    # reachable beyond your own network.
    expose:
      - "${HTTP_PORT:-6677}"
    ports:
      - "${HTTP_PORT:-6677}:${HTTP_PORT:-6677}"
      - "${P2P_PORT:-44556}:${P2P_PORT:-44556}/tcp"
      - "${P2P_PORT:-44556}:${P2P_PORT:-44556}/udp"
    networks:
      - acestream-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -t1 -O- http://127.0.0.1:$${HTTP_PORT}/webui/api/service?method=get_version | grep -q '\"error\": null'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # Keeps all engine caching (live buffer + session state) in RAM instead
    # of the container's disk-backed writable layer. Resets on restart,
    # which is fine — it's just P2P session state, not configuration.
    tmpfs:
      - /srv/ace/.ACEStream:size=512m,mode=1777

  acexy:
    # Pinned (not :latest) deliberately, so an upstream update can't change
    # behavior without warning. Bump ACEXY_VERSION after checking:
    # https://github.com/Javinator9889/acexy/releases
    image: ghcr.io/javinator9889/acexy:${ACEXY_VERSION:-0.2.2}
    container_name: acexy
    restart: unless-stopped
    depends_on:
      acestream:
        condition: service_healthy
    environment:
      ACEXY_HOST: acestream
      ACEXY_PORT: "${HTTP_PORT:-6677}"
      ACEXY_LISTEN_ADDR: ":8080"
      # Raised from acexy's 1s default: the engine often needs longer than
      # that to find first peers, causing spurious "timeout awaiting
      # response headers" failures otherwise.
      ACEXY_NO_RESPONSE_TIMEOUT: "${ACEXY_NO_RESPONSE_TIMEOUT:-30s}"
      # Buffer before handing data to the player — raise if playback is
      # choppy. Upstream default: 4.2MiB.
      ACEXY_BUFFER_SIZE: "${ACEXY_BUFFER_SIZE:-4.2MiB}"
      # How long to tolerate a silent client before evicting it — raise if
      # brief player hiccups cause stutter. Upstream default: 5s.
      ACEXY_CLIENT_EVICTION_TIMEOUT: "${ACEXY_CLIENT_EVICTION_TIMEOUT:-10s}"
    ports:
      - "${ACEXY_PORT_EXPOSED:-8080}:8080"
    networks:
      - acestream-net

  webui:
    # Same story as acestream above: image: for pulling as-is, build: for
    # "docker compose up -d --build" to build from ./webui instead.
    image: ghcr.io/${GITHUB_OWNER:-gabo-it}/acestream-webui:latest
    build: ./webui
    container_name: acestream-webui
    restart: unless-stopped
    depends_on:
      - acexy
    environment:
      PORT: "4000"
      DB_PATH: /data/acestream.db
      ENV_FILE_PATH: /config/.env
      ACESTREAM_HTTP_PORT: "${HTTP_PORT:-6677}"
    volumes:
      - webui-data:/data
      # Lets the Engine tab display current parameters, read straight from
      # the engine container's own logs (most reliable — reflects exactly
      # what's running) via the Docker socket, falling back to the .env
      # file below if the socket isn't available. Remove either line if
      # you'd rather not grant that access; the tab falls back gracefully
      # either way, down to built-in defaults as a last resort.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.env:/config/.env
    ports:
      - "${WEBUI_PORT_EXPOSED:-4000}:4000"
    networks:
      - acestream-net

  # Optional: self-hosted translation engine for EPG program-title
  # translation and cross-alphabet tvg-id/logo matching — no third-party
  # service involved, everything stays on your own hardware. Disabled by
  # default; start it explicitly alongside the rest of the stack with:
  #   docker compose --profile translate up -d
  # Once it's running, go to Sources → "LibreTranslate URL" in the web UI
  # and set it to: http://libretranslate:5000
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    profiles: ["translate"]
    environment:
      # Loads only the languages you actually need — each one costs
      # roughly 200MB of RAM (per LibreTranslate's own sizing guidance).
      # Loading all 30+ supported languages instead needs several GB.
      # Defaults below cover this project's four target languages
      # (it, en, fr, es) plus common EPG source languages — adjust the
      # list to match whatever your own EPG guides actually use.
      LT_LOAD_ONLY: "${LIBRETRANSLATE_LANGUAGES:-en,it,fr,es,ru,de,pl,pt,tr}"
    volumes:
      # Caches downloaded language models so they persist across
      # restarts — without this, every restart re-downloads them (can
      # take several minutes depending on how many languages are loaded).
      - libretranslate-models:/home/libretranslate/.local
    networks:
      - acestream-net

networks:
  acestream-net:
    driver: bridge

volumes:
  webui-data:
  libretranslate-models:
