name: Cleanup Untagged Package Versions

# Manual only: run from the Actions tab whenever you want to prune old
# untagged/SHA-tagged image versions accumulated from past pushes. Never
# runs automatically, so there's no risk of it firing unexpectedly.
#
# NOTE: this always deletes for real — actions/delete-package-versions@v5
# does not actually support a dry-run input (an earlier version of this
# workflow had one, but it was silently ignored). It only ever touches
# UNTAGGED versions (delete-only-untagged-versions: true below), so tagged
# versions like :latest, :v1.0, :3.2.11 are never at risk from this.
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [acestream-engine, acestream-webui]
    steps:
      - name: Delete untagged versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          delete-only-untagged-versions: 'true'
