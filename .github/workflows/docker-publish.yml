name: Publish Multi-Container & Update Descriptions to Docker Hub

on:
  # Allows manual triggering from the GitHub Actions tab with an optional version input
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g., 1.1.0 or leave empty for latest only)'
        required: false
        default: ''
  # Automatically triggers on Git tag pushes matching semver patterns
  push:
    tags:
      - 'v*.*'
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- METADATA FOR WEB UI ---
      - name: Extract metadata (WebUI)
        id: meta-webui
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      # --- CONTAINER 1: WEB UI ---
      - name: Build and Push WebUI
        uses: docker/build-push-action@v5
        with:
          context: ./webui
          file: ./webui/Dockerfile
          push: true
          tags: ${{ steps.meta-webui.outputs.tags }}
          labels: ${{ steps.meta-webui.outputs.labels }}

      - name: Update Docker Hub Description (WebUI)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui
          readme-filepath: ./docker-hub/webui-readme.md

      # --- METADATA FOR ENGINE ---
      - name: Extract metadata (Engine)
        id: meta-engine
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      # --- CONTAINER 2: ENGINE ---
      - name: Build and Push Engine
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          labels: ${{ steps.meta-engine.outputs.labels }}

      - name: Update Docker Hub Description (Engine)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine
          readme-filepath: ./docker-hub/engine-readme.md