name: Publish Multi-Container & Update Descriptions to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 1. CONTAINER WEB UI
      # ==========================================
      - name: Build e Push Container WebUI
        uses: docker/build-push-action@v5
        with:
          context: ./webui
          file: ./webui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui:${{ github.sha }}

      - name: Aggiorna Description Docker Hub per WebUI
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui
          readme-filepath: ./docker-hub/webui-readme.md

      # ==========================================
      # 2. CONTAINER ENGINE
      # ==========================================
      - name: Build e Push Container Engine
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine:${{ github.sha }}

      - name: Aggiorna Description Docker Hub per Engine
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine
          readme-filepath: ./docker-hub/engine-readme.md
