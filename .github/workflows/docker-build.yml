name: Build & Publish Images

on:
  schedule:
    # Every Monday at 05:00 UTC — checks whether a new AceStream engine
    # version has been released and, if so, rebuilds and publishes images.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'webui/**'
      - '.github/workflows/docker-build.yml'
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
# If you see "denied: permission_denied: read_package" (or write_package)
# despite this block, the most common cause (confirmed by many identical
# reports) is a PACKAGE THAT ALREADY EXISTS on ghcr.io not correctly linked
# to this repository — often happens after a first failed attempt, or a
# repo recreated with the same name. The fix that almost always works:
#   1. Go to https://github.com/gabo-it?tab=packages
#   2. Open the "acestream-engine" package (and "acestream-webui" if needed)
#   3. Package settings → Manage Actions access → add this repository
#      with "Write" role
#   4. If the package has nothing useful in it, you can instead delete it
#      entirely: the next workflow run recreates it, this time correctly
#      linked
# Also check separately: Settings → Actions → General → Workflow
# permissions → must be "Read and write permissions".

env:
  REGISTRY: ghcr.io

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version || steps.detect_tag.outputs.version }}
      changed: ${{ steps.detect.outputs.changed || steps.detect_tag.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect the latest published AceStream engine version
        id: detect
        # On a version tag (e.g. v1.0.0), we want a "frozen" release build
        # from exactly what's committed — not a silent engine version bump
        # baked into a numbered release. Skip detection entirely there.
        if: github.ref_type != 'tag'
        run: |
          set -e
          CURRENT=$(cat engine/VERSION)

          # The official page lists the latest linux tarballs; we extract
          # the version number from the filename with a regex.
          LATEST=$(curl -fsSL https://docs.acestream.net/en/products/ \
            | grep -oE 'acestream_[0-9]+\.[0-9]+\.[0-9]+_ubuntu_22\.04_x86_64_py3\.10\.tar\.gz' \
            | head -n1 \
            | sed -E 's/acestream_([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)

          if [ -z "$LATEST" ]; then
            echo "::warning::Version detection failed, keeping $CURRENT"
            LATEST="$CURRENT"
          fi

          echo "Current version: $CURRENT — Detected version: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use committed engine version as-is (tag build)
        if: github.ref_type == 'tag'
        id: detect_tag
        run: |
          echo "version=$(cat engine/VERSION)" >> "$GITHUB_OUTPUT"
          echo "changed=false" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    # On manual push or workflow_dispatch we build regardless; on the
    # scheduled cron only if the engine version actually changed.
    if: needs.check-version.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update engine/VERSION
        # No-op on a tag build (detect_tag already read this same file), but
        # harmless either way.
        run: echo "${{ needs.check-version.outputs.version }}" > engine/VERSION

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags for this run
        id: image_tags
        # On a version tag (e.g. v1.0.0) both images also get that exact
        # tag, in addition to the usual :latest / engine-version tags —
        # this is what makes `git tag v1.0.0 && git push --tags` actually
        # produce a pinned, pullable image on ghcr.io. Same images are also
        # pushed to Docker Hub under the same tags.
        run: |
          ENGINE_TAGS=(
            "ghcr.io/${{ github.repository_owner }}/acestream-engine:latest"
            "ghcr.io/${{ github.repository_owner }}/acestream-engine:${{ needs.check-version.outputs.version }}"
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine:latest"
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine:${{ needs.check-version.outputs.version }}"
          )
          WEBUI_TAGS=(
            "ghcr.io/${{ github.repository_owner }}/acestream-webui:latest"
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui:latest"
          )
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ENGINE_TAGS+=(
              "ghcr.io/${{ github.repository_owner }}/acestream-engine:${{ github.ref_name }}"
              "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine:${{ github.ref_name }}"
            )
            WEBUI_TAGS+=(
              "ghcr.io/${{ github.repository_owner }}/acestream-webui:${{ github.ref_name }}"
              "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui:${{ github.ref_name }}"
            )
          fi
          {
            echo "engine_tags<<EOF"
            printf '%s\n' "${ENGINE_TAGS[@]}"
            echo "EOF"
            echo "webui_tags<<EOF"
            printf '%s\n' "${WEBUI_TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push acestream-engine
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          build-args: |
            ACESTREAM_VERSION=${{ needs.check-version.outputs.version }}
          push: true
          tags: ${{ steps.image_tags.outputs.engine_tags }}

      - name: Build & push acestream-webui
        uses: docker/build-push-action@v6
        with:
          context: ./webui
          push: true
          tags: ${{ steps.image_tags.outputs.webui_tags }}

      - name: Sync Docker Hub overview (acestream-engine)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-engine
          short-description: 'Self-maintained AceStream engine, auto-rebuilt on new releases. See gabo-it/Acestream-Manager.'
          readme-filepath: ./docker-hub/engine-readme.md

      - name: Sync Docker Hub overview (acestream-webui)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-webui
          short-description: 'Web UI for AceStream channels, EPG & playlists. See gabo-it/Acestream-Manager.'
          readme-filepath: ./docker-hub/webui-readme.md

      - name: Commit detected version bump
        # Never on a tag build: a tag ref isn't something you can `git push`
        # a commit onto, and a frozen release shouldn't silently gain one
        # anyway.
        if: needs.check-version.outputs.changed == 'true' && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engine/VERSION
          git commit -m "chore: bump acestream engine to ${{ needs.check-version.outputs.version }}" || echo "nothing to commit"
          git push
