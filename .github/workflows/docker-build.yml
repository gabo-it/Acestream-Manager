name: Build e Push delle Immagini Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Autenticazione su GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurazione Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push - AceStream Engine
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acestream-engine:latest
            ghcr.io/${{ github.repository_owner }}/acestream-engine:${{ github.sha }}

      - name: Build e Push - AceStream WebUI
        uses: docker/build-push-action@v5
        with:
          context: ./webui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acestream-webui:latest
            ghcr.io/${{ github.repository_owner }}/acestream-webui:${{ github.sha }}
